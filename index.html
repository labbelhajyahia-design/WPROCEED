<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Procédures Automates</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0d6b7a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout : une colonne façon fiche de poste, barre d'écoute fixée en bas, panneaux plein écran pour la saisie photo */
:root{
  --paper:#eef2f3; --surface:#ffffff; --sunk:#e3e9eb; --ink:#10232b; --muted:#566a71; --line:#cfd9dc;
  --accent:#0d6b7a; --accent-ink:#ffffff; --accent-soft:#d6ecef;
  --stop:#b42318; --stop-bg:#fdecea; --warn:#9a5b00; --warn-bg:#fff2d6; --note-bg:#e8eef0;
  --hl:#ffb000; --shade:rgba(8,20,26,.42);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0c1417; --surface:#132024; --sunk:#0f1a1d; --ink:#e3edef; --muted:#93a7ad; --line:#24363c;
  --accent:#4fb6c4; --accent-ink:#06191d; --accent-soft:#16343a;
  --stop:#f2877b; --stop-bg:#371a1a; --warn:#f1b257; --warn-bg:#33270f; --note-bg:#1a292d;
  --hl:#ffc233; --shade:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0c1417; --surface:#132024; --sunk:#0f1a1d; --ink:#e3edef; --muted:#93a7ad; --line:#24363c;
  --accent:#4fb6c4; --accent-ink:#06191d; --accent-soft:#16343a;
  --stop:#f2877b; --stop-bg:#371a1a; --warn:#f1b257; --warn-bg:#33270f; --note-bg:#1a292d;
  --hl:#ffc233; --shade:rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:2.1rem;letter-spacing:.01em}
h2{font-size:1.45rem}
h3{font-size:1.15rem;font-weight:600}
.eyebrow{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.12em;font-size:.8rem;color:var(--accent)}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:.82rem;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:.95rem;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;padding:0 10px}
.btn.small{min-height:36px;padding:0 12px;font-size:.88rem}
.btn.danger{color:var(--stop);border-color:var(--stop)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px;flex:none}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;cursor:pointer;flex:none}
.icon-btn svg{width:20px;height:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.top{padding-top:22px;padding-bottom:14px;display:flex;flex-direction:column;gap:6px}
.storage{display:inline-flex;gap:6px;align-items:center;font-size:.85rem;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}

/* Liste des automates */
.cards{display:grid;gap:12px;margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;cursor:pointer;text-align:left;width:100%}
.card:hover{border-color:var(--accent)}
.card h2{font-size:1.5rem}
.meter{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-top:10px;max-width:260px}
.meter i{display:block;height:100%;background:var(--accent)}
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;display:grid;gap:10px;justify-items:center;margin-top:14px}

/* Vue automate */
.back{margin-left:-10px}
.tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--line);margin-top:14px;overflow-x:auto}
.tab{background:none;border:0;padding:12px 12px;font-family:var(--f-display);font-weight:600;font-size:1.05rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1.5px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);z-index:5}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.85rem;white-space:nowrap;cursor:pointer}
.rules{background:var(--stop-bg);border:1.5px solid var(--stop);border-radius:var(--r);padding:14px 16px;margin-top:16px}
.rules h2{color:var(--stop);font-size:1.25rem;text-transform:uppercase;letter-spacing:.04em}
.rules ul{margin:8px 0 0;padding-left:20px;display:grid;gap:6px}
.rub{margin-top:26px;scroll-margin-top:60px}
.rub-head{display:flex;gap:12px;align-items:center;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:6px}
.rub-head .num{font-family:var(--f-mono);font-size:.85rem;color:var(--accent);margin-right:6px}
.q{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.q.todo{background:transparent;border-style:dashed}
.steps{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:12px;counter-reset:s}
.step{display:grid;grid-template-columns:30px 1fr;gap:10px;counter-increment:s;border-radius:8px;padding:6px;margin:-6px;transition:background .2s}
.step::before{content:counter(s);font-family:var(--f-mono);font-size:.82rem;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:500}
.step.speaking{background:var(--accent-soft)}
.step-body{min-width:0;display:grid;gap:6px}
.kbd{display:inline-block;font-family:var(--f-mono);font-size:.8rem;border:1.5px solid var(--ink);border-bottom-width:3px;border-radius:6px;padding:1px 7px;background:var(--surface)}
.alert{border-radius:6px;padding:6px 10px;font-size:.92rem;display:flex;gap:8px;align-items:flex-start}
.alert b{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.06em;font-size:.82rem;padding-top:2px;white-space:nowrap}
.alert.absolu{background:var(--stop-bg);color:var(--stop)}
.alert.attention{background:var(--warn-bg);color:var(--warn)}
.alert.note{background:var(--note-bg);color:var(--muted)}
.alert span{color:var(--ink)}

/* Photo avec bouton mis en évidence */
.shot{position:relative;overflow:hidden;border-radius:8px;border:1px solid var(--line);max-width:420px;background:var(--sunk);line-height:0}
.shot img{width:100%;display:block}
.hl{position:absolute;border:3px solid var(--hl);border-radius:6px;box-shadow:0 0 0 9999px var(--shade);pointer-events:none}
.hl::after{content:"";position:absolute;inset:-8px;border:2px solid var(--hl);border-radius:10px;animation:pulse 1.6s ease-out infinite}
.hl-tag{position:absolute;transform:translateY(-100%);background:var(--hl);color:#1d1400;font-family:var(--f-mono);font-size:.72rem;line-height:1.3;padding:2px 6px;border-radius:4px 4px 0 0;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
@keyframes pulse{0%{opacity:.9;transform:scale(.96)}100%{opacity:0;transform:scale(1.12)}}
@media (prefers-reduced-motion: reduce){.hl::after{animation:none;opacity:.6}}

/* Saisie */
.wizard{margin-top:16px;display:grid;gap:14px}
.progress{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.qtext{font-family:var(--f-display);font-size:1.7rem;font-weight:600;line-height:1.15;text-wrap:balance}
.dictee{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.mic{width:72px;height:72px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;position:relative}
.mic svg{width:32px;height:32px}
.mic.on{background:var(--stop)}
.mic.on::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px solid var(--stop);animation:pulse 1.2s ease-out infinite}
textarea{width:100%;min-height:120px;border:1.5px solid var(--line);border-radius:var(--r);padding:12px;background:var(--surface);resize:vertical;line-height:1.5}
input[type=text],select{width:100%;min-height:44px;border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
label.f{display:grid;gap:4px;font-size:.88rem;color:var(--muted);font-weight:700}
.edit-steps{display:grid;gap:10px}
.estep{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:8px}
.estep-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.estep .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.thumb{width:64px;height:48px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.navbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hint{font-size:.85rem;color:var(--muted)}
.form{display:grid;gap:12px;margin-top:16px}
.form .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.estep .grid2,.form .grid2{grid-template-columns:1fr}.qtext{font-size:1.45rem}h1{font-size:1.8rem}}

/* Panneau plein écran (photo) */
.sheet{position:fixed;inset:0;background:var(--paper);z-index:40;overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px))}
.stage{position:relative;touch-action:none;user-select:none;-webkit-user-select:none;max-width:560px;line-height:0;border-radius:8px;overflow:hidden;border:1px solid var(--line);cursor:crosshair}
.stage img{width:100%;display:block;pointer-events:none}
.pick{display:grid;place-items:center;gap:8px;border:2px dashed var(--line);border-radius:var(--r);padding:30px;text-align:center;cursor:pointer;background:var(--surface)}

/* Barre d'écoute */
.player{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--ink);color:var(--paper);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(16px,env(safe-area-inset-left,0px))}
.player .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.player .now{min-width:0}
.player .now small{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.1em;opacity:.75;font-size:.75rem}
.player .now div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .ctl{display:flex;gap:6px;align-items:center}
.player .icon-btn{background:transparent;border-color:rgba(255,255,255,.25);color:var(--paper)}
.player .icon-btn.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.player .rate{font-family:var(--f-mono);font-size:.8rem;background:transparent;border:1px solid rgba(255,255,255,.25);color:var(--paper);border-radius:999px;min-height:36px;padding:0 10px;cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 96px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;z-index:60;max-width:min(92vw,520px);font-size:.92rem;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.confirm{background:var(--stop-bg);border:1px solid var(--stop);border-radius:var(--r);padding:12px;display:grid;gap:10px}
.search{display:flex;gap:8px;align-items:center;margin-top:14px}
.search input{flex:1;min-width:0;min-height:46px;border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;background:var(--surface)}
mark{background:var(--hl);color:#1d1400;border-radius:3px;padding:0 1px}
.results{display:grid;gap:10px;margin-top:12px}
.res{background:var(--surface);border:1.5px solid var(--accent);border-radius:var(--r);padding:12px 14px}
.res-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;width:100%;background:none;border:0;padding:0;cursor:pointer;text-align:left;font-size:1rem}
.res ul{margin:8px 0 0;padding-left:18px;display:grid;gap:6px}
.rub-head{flex-wrap:wrap}
.preview{border:1.5px dashed var(--accent);border-radius:var(--r);padding:12px 14px;background:var(--surface)}
.preview .steps{margin-top:8px}
.audio-imp{border:1.5px solid var(--line);border-radius:var(--r);padding:14px;background:var(--surface);display:grid;gap:10px}
.audio-imp h3{display:flex;gap:8px;align-items:center}.audio-imp h3 svg{width:20px;height:20px;color:var(--accent)}
.spinner{width:20px;height:20px;border-radius:50%;border:3px solid var(--accent-soft);border-top-color:var(--accent);animation:spin 1s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.qres{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.qres-item{width:100%;text-align:left;display:grid;gap:2px;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;font-size:.98rem}
.qres-item:hover{border-color:var(--accent)}
.q-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.q-head h3{min-width:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<div class="wrap" id="app"><div class="top"><span class="eyebrow">Fiches de poste</span><h1>Procédures Automates</h1><p class="muted">Chargement des automates…</p></div></div>
<div class="player" id="player" hidden></div>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
/* ---------- Modèle de questions (identique au document « Modèle de procédure automate ») ---------- */
const RUBRIQUES = [
  {id:"alertes", titre:"Alertes et règles absolues", q:[
    {id:"a1", t:"Qu'est-ce qu'il ne faut jamais faire sur cet automate ?"},
    {id:"a2", t:"Quels équipements de protection porter ?"},
    {id:"a3", t:"Quels pièges fréquents faut-il signaler ?"}]},
  {id:"avant", titre:"Avant de démarrer", q:[
    {id:"b1", t:"Quels consommables vérifier, et où sont-ils ?"},
    {id:"b2", t:"Comment préparer chaque solution ?"},
    {id:"b3", t:"Quels remplissages faut-il confirmer dans le logiciel ?"}]},
  {id:"demarrer", titre:"Démarrer l'automate", q:[
    {id:"c1", t:"Comment allumer l'automate et le logiciel ?"},
    {id:"c2", t:"Quelle initialisation lancer ?"},
    {id:"c3", t:"Quelle maintenance faire avant les tests ?"}]},
  {id:"calibration", titre:"Calibration et contrôles qualité", q:[
    {id:"k1", t:"Quand faut-il calibrer, et comment le savoir ?"},
    {id:"k2", t:"Comment passer une calibration ?"},
    {id:"k3", t:"Comment passer les contrôles qualité ?"},
    {id:"k4", t:"Que faire si une calibration ou un contrôle est hors limites ?"}]},
  {id:"test", titre:"Passer un test", q:[
    {id:"d1", t:"Comment choisir la position et identifier le tube ?"},
    {id:"d2", t:"Que vérifier avant de placer le tube ?"},
    {id:"d3", t:"Comment lancer la série ?"}]},
  {id:"reactifs", titre:"Réactifs et échantillons", q:[
    {id:"e1", t:"Comment et quand changer un réactif ?"},
    {id:"e2", t:"Comment ajouter ou remplacer un échantillon en cours ?"}]},
  {id:"valider", titre:"Valider les résultats", q:[
    {id:"f1", t:"Où voir les alarmes et les remarques ?"},
    {id:"f2", t:"Que faire en cas d'alarme ?"}]},
  {id:"arreter", titre:"Arrêter l'automate", q:[
    {id:"g1", t:"Quelle maintenance faire après les essais ?"},
    {id:"g2", t:"Comment quitter le logiciel et éteindre ?"}]},
  {id:"maintenance", titre:"Maintenance et pannes", q:[
    {id:"h1", t:"Quelles maintenances hebdomadaires ou mensuelles ?"},
    {id:"h2", t:"Quelles erreurs fréquentes, et leur solution ?"},
    {id:"h3", t:"Qui appeler si le problème persiste ?"}]}
];
const ALLQ = RUBRIQUES.flatMap((r,ri)=>r.q.map(q=>({...q, rub:r, ri})));
const QI = Object.fromEntries(ALLQ.map(q=>[q.id,q]));
const FICHE = [["nom","Nom de l'automate"],["fabricant","Fabricant"],["modele","Modèle"],["secteur","Paramètres / secteur"],["emplacement","Emplacement"],["referent","Technicien référent"],["sav","Numéro SAV"]];

async function compress(file, max=1400, q=.82){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    const k = Math.min(1, max/Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return await new Promise(res=>c.toBlob(b=>res(b||file),"image/jpeg",q));
  } finally { URL.revokeObjectURL(url); }
}

function prepare(a){

  return a;
}
const isNA = (a,qid) => !!(a.reponses&&a.reponses[qid]&&a.reponses[qid].na);
const hasContent = (a,qid) => { const r=a.reponses&&a.reponses[qid]; return !!(r && !r.na && ((r.etapes&&r.etapes.some(e=>e.action)) || (r.texte&&r.texte.trim()))); };

function hi(t, ts){ t=String(t??""); if(!ts||!ts.length) return esc(t);
  const chars=[...t]; let n=""; const map=[]; chars.forEach((c,i)=>{ for(const ch of norm(c)){ n+=ch; map.push(i); } });
  const mk=new Array(chars.length).fill(false); ts.forEach(w=>{ let p=n.indexOf(w); while(p>=0){ for(let k=p;k<p+w.length;k++) mk[map[k]]=true; p=n.indexOf(w,p+1); } });

function qResults(d){
  const ts=terms(S.qsearch||""); if(!ts.length) return "";
  const hits=ALLQ.map((q,i)=>({q,i})).filter(({q})=>{ const h=norm(q.rub.titre+" "+q.t)+" "+(hasContent(d,q.id)?stepsOf(d.reponses[q.id]).map(e=>norm(e.action+" "+e.bouton+" "+e.alerte)).join(" ")+" "+norm(d.reponses[q.id].texte):""); return ts.every(w=>h.includes(w)); });
  if(!hits.length) return `<p class="muted" style="margin:6px 0 0">Aucune question ne contient « ${esc(S.qsearch)} ».</p>`;
  return `<ul class="qres">${hits.slice(0,10).map(({q,i})=>{ const st=isNA(d,q.id)?"Sans objet":hasContent(d,q.id)?"Renseignée":"À compléter";
    const ex=hasContent(d,q.id)?stepsOf(d.reponses[q.id]).find(e=>ts.every(w=>norm(e.action+" "+e.bouton+" "+e.alerte).includes(w))):null;
    return `<li><button class="qres-item" data-act="goq" data-i="${i}"><span class="eyebrow">${q.ri+1}. ${esc(q.rub.titre)} · ${st}</span><span>${hi(q.t,ts)}</span>${ex?`<span class="muted" style="font-size:.88rem">${hi(ex.action,ts)}</span>`:""}</button></li>`; }).join("")}</ul>
    ${hits.length>10?`<p class="hint">… et ${hits.length-10} autres : précisez la recherche.</p>`:""}`;
}
function searchBox(id, val, ph){
  return `<div class="search" role="search"><input type="search" id="${id}" value="${esc(val)}" placeholder="${esc(ph)}" aria-label="Rechercher" autocomplete="off">
    <button class="icon-btn" data-act="voice-search" data-target="${id}" aria-label="Rechercher à la voix">${I.mic}</button></div>`;
}
function globalResults(list){
  const ts=terms(S.searchAll); let total=0;
  const blocks=list.map(a=>{ const qs=ALLQ.filter(q=>hasContent(a,q.id)&&matchQ(a,q,ts)); total+=qs.length; if(!qs.length) return "";
    return `<div class="res"><button class="res-head" data-act="open-search" data-id="${esc(a.id)}"><strong>${esc(a.nom)}</strong><span class="muted">${qs.length} résultat${qs.length>1?"s":""} · ouvrir</span></button>
      <ul>${qs.slice(0,4).map(q=>`<li><span class="eyebrow">${esc(q.rub.titre)}</span><br>${hi(q.t,ts)}</li>`).join("")}${qs.length>4?`<li class="muted">… et ${qs.length-4} autres</li>`:""}</ul></div>`; }).join("");
  return total?`<div class="results">${blocks}</div>`:`<p class="muted" style="margin-top:12px">Aucun passage ne contient « ${esc(S.searchAll)} ».</p>`;
}

function viewLire(a){
  const ts=terms(S.search), searching=ts.length>0;
  const absolus = ALLQ.flatMap(q=>hasContent(a,q.id)?stepsOf(a.reponses[q.id]).filter(e=>e.niveau==="absolu"):[]);
  let found=0, shown=0;
  const rubs = RUBRIQUES.map((r,ri)=>{
    const qs=r.q.filter(q=>!isNA(a,q.id) && matchQ(a,q,ts));
    if(searching && !qs.length) return "";
    shown += qs.length;
    const allNA = r.q.every(q=>isNA(a,q.id));
    const anyContent = r.q.some(q=>hasContent(a,q.id));
    found += qs.filter(q=>hasContent(a,q.id)).length;
    return `<section class="rub" id="rub-${r.id}"><div class="rub-head"><h2><span class="num">${String(ri+1).padStart(2,"0")}</span>${esc(r.titre)}</h2>

      ${allNA?`<p class="muted">Sans objet pour cet automate.</p>`:qs.map(q=>{ const rep=a.reponses[q.id];
        if(!hasContent(a,q.id)) return `<div class="q todo"><h3>${esc(q.t)}</h3><div class="row" style="margin-top:6px"><span class="muted">À compléter</span><button class="btn small" data-act="answer" data-q="${q.id}">${I.mic}Répondre</button><button class="btn small ghost" data-act="set-na" data-q="${q.id}">Sans objet</button></div></div>`;
        const et=stepsOf(rep);
        return `<div class="q"><div class="q-head"><h3>${hi(q.t,ts)}</h3><button class="btn small" data-act="answer" data-q="${q.id}" aria-label="Corriger : ${esc(q.t)}">Corriger</button></div>${et.length?`<ol class="steps">${et.map((e,i)=>`<li class="step" data-key="${q.id}:${i}"><div class="step-body">
          <div>${fmtAction(e.action,ts)}${e.bouton?` <span class="kbd">${hi(e.bouton,ts)}</span>`:""}</div>${alertHTML(e,ts)}${shotHTML(e)}</div></li>`).join("")}</ol>`
          :`<p style="margin:8px 0 0" data-key="${q.id}:t">${hi(rep.texte,ts)}</p>`}</div>`; }).join("")}
    </section>`; }).join("");
  return `${searchBox("search", S.search, "Rechercher : calibration, réactif, arrêter…")}
  ${searching?`<div class="row" style="margin-top:10px"><span class="muted">${found} passage${found>1?"s":""} trouvé${found>1?"s":""}</span>${found?`<button class="btn small" data-act="listen-found">${I.speak}Écouter les résultats</button>`:""}<button class="btn small ghost" data-act="clear-search">Effacer la recherche</button></div>`
  :`<nav class="chips" aria-label="Rubriques">${RUBRIQUES.map((r,i)=>`<button class="chip" data-act="jump" data-rub="${r.id}">${i+1}. ${esc(r.titre)}</button>`).join("")}</nav>
  <div class="row" style="margin-top:8px"><button class="btn primary" data-act="listen-all" data-id="${esc(a.id)}">${I.play}Écouter toute la procédure</button><button class="btn" data-act="word-all">${I.doc}Procédure complète en Word</button></div>
  ${absolus.length?`<section class="rules"><h2>Règles absolues</h2><ul>${absolus.map(e=>`<li><strong>${esc(e.action)}</strong>${e.alerte?` <span class="muted">${esc(e.alerte)}</span>`:""}</li>`).join("")}</ul></section>`:""}`}

}

/* ---------- Texte de la procédure (copie et téléchargement) ---------- */
function procedureText(a){
  const L=[`PROCÉDURE — ${a.nom}`, [a.fabricant,a.modele].filter(Boolean).join(" · "), ""];
  FICHE.slice(3).forEach(([k,l])=>{ if(a[k]) L.push(`${l} : ${a[k]}`); });
  RUBRIQUES.forEach((r,ri)=>{ L.push("", `${ri+1}. ${r.titre.toUpperCase()}`);
    r.q.forEach(q=>{ L.push("", q.t); const rep=a.reponses[q.id];
      if(isNA(a,q.id)){ L.push("  Sans objet pour cet automate"); return; }
      if(!hasContent(a,q.id)){ L.push("  À compléter"); return; }
      const ets=stepsOf(rep);
      if(ets.length) ets.forEach((e,i)=>{ L.push(`  ${i+1}. ${e.action}${e.bouton?` [${e.bouton}]`:""}`); if(e.alerte) L.push(`     ${(NIVEAUX[e.niveau]||"Remarque").toUpperCase()} : ${e.alerte}`); });
      else L.push("  "+rep.texte); }); });
  return L.join("\n");
}

/* ---------- Lecture audio ---------- */
const TTS = { q:[], i:0, playing:false, tok:0, rate:1, voice:null, ok:"speechSynthesis" in window,
  init(){ if(!this.ok) return; const pick=()=>{ const v=speechSynthesis.getVoices(); this.voice=v.find(x=>/^fr[-_]FR/i.test(x.lang))||v.find(x=>/^fr/i.test(x.lang))||null; }; pick(); try{ speechSynthesis.addEventListener("voiceschanged",pick); }catch(e){} },
  say(text, after){ if(!this.ok){ if(after) after(); return; } this.stop(); const tok=this.tok; const u=this.utt(text); if(after) u.onend=()=>{ if(tok===this.tok) after(); }; speechSynthesis.speak(u); },
  utt(text){ const u=new SpeechSynthesisUtterance(text); u.lang="fr-FR"; if(this.voice) u.voice=this.voice; u.rate=this.rate; return u; },
  start(items, label){ if(!this.ok){ toast("La lecture audio n'est pas disponible sur cet appareil."); return; } if(!items.length){ toast("Rien à lire pour l'instant : la procédure est vide."); return; }
    this.q=items; this.i=0; this.label=label; this.playing=true; this.speak(); },
  speak(){ const tok=++this.tok; speechSynthesis.cancel(); const it=this.q[this.i];
    if(!it){ this.stop(); toast("Fin de la lecture."); return; }
    drawPlayer(); markSpeaking(true);
    const u=this.utt(it.text); u.onend=()=>{ if(tok!==this.tok||!this.playing) return; this.i++; this.speak(); };
    u.onerror=()=>{}; speechSynthesis.speak(u); },
  toggle(){ if(this.playing){ this.playing=false; this.tok++; speechSynthesis.cancel(); drawPlayer(); } else { this.playing=true; this.speak(); } },
  move(d){ this.i=Math.max(0,Math.min(this.q.length-1,this.i+d)); this.playing=true; this.speak(); },
  stop(silent){ this.playing=false; this.tok++; if(this.ok) speechSynthesis.cancel(); if(!silent){ this.q=[]; drawPlayer(); markSpeaking(); } }
};
function itemsFor(a, rubIds, qids){
  const out=[];
  RUBRIQUES.forEach((r,ri)=>{ if(rubIds && !rubIds.includes(r.id)) return;
    const qs=r.q.filter(q=>hasContent(a,q.id) && (!qids||qids.includes(q.id))); if(!qs.length) return;
    out.push({text:`Rubrique ${ri+1}. ${r.titre}.`, label:r.titre, rub:r.id});
    qs.forEach(q=>{ const rep=a.reponses[q.id];
      out.push({text:q.t, label:r.titre, rub:r.id});
      const ets=stepsOf(rep);
      if(ets.length) ets.forEach((e,i)=>{
        let t=`Étape ${i+1}. ${e.action}`; if(e.alerte) t+=` ${e.niveau==="absolu"?"Règle absolue":e.niveau==="attention"?"Attention":"Remarque"} : ${e.alerte}`;
        out.push({text:t, label:`${r.titre} · étape ${i+1}`, key:`${q.id}:${i}`, rub:r.id}); });
      else out.push({text:rep.texte, label:r.titre, key:`${q.id}:t`, rub:r.id}); }); });
  return out;
}
function drawPlayer(){
  const p=$("#player");
  if(!TTS.q.length){ p.hidden=true; p.innerHTML=""; return; }
  const it=TTS.q[TTS.i]||{};
  p.hidden=false;
  p.innerHTML=`<div class="in"><div class="now"><small>${esc(TTS.label||"")} · ${TTS.i+1} / ${TTS.q.length}</small><div>${esc(it.text||"")}</div></div>
  <div class="ctl"><button class="icon-btn" data-act="p-prev" aria-label="Élément précédent">${I.prev}</button>
  <button class="icon-btn main" data-act="p-toggle" aria-label="${TTS.playing?"Pause":"Reprendre"}">${TTS.playing?I.pause:I.play}</button>
  <button class="icon-btn" data-act="p-next" aria-label="Élément suivant">${I.next}</button>
  <button class="rate" data-act="p-rate" aria-label="Vitesse de lecture">×${TTS.rate}</button>
  <button class="icon-btn" data-act="p-stop" aria-label="Arrêter la lecture">${I.stop}</button></div></div>`;
}
function markSpeaking(scroll){
  document.querySelectorAll(".speaking").forEach(el=>el.classList.remove("speaking"));
  const it=TTS.q.length && TTS.q[TTS.i]; if(!it || S.view!=="auto" || S.tab!=="lire") return;
  const el = it.key ? document.querySelector(`[data-key="${it.key}"]`) : (it.rub ? document.getElementById("rub-"+it.rub) : null);
  if(el){ if(it.key) el.classList.add("speaking"); if(scroll) el.scrollIntoView({block:"center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}); }
}

/* ---------- Dictée ---------- */
let REC=null;
let REC_WANT=false;
function stopRec(){ REC_WANT=false; if(REC){ const r=REC; REC=null; try{ r.stop(); }catch(e){} } }
function startRec(tid="answer"){
  const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
  const ta = $("#"+tid);
  if(!SR){ toast("Touchez la zone de texte puis le micro du clavier pour dicter."); ta&&ta.focus(); return; }
  if(REC){ stopRec(); render(); return; }
  TTS.stop();
  const put = v => { if(tid==="answer") setText(v); else S.imp.texte=v; };
  const android = /Android/i.test(navigator.userAgent);
  let acc = ta.value.trim() ? ta.value.trim()+(tid==="imptext"?"\n":" ") : "";
  REC_WANT = true;
  const launch = () => {
    const rec = new SR(); rec.lang="fr-FR"; rec.continuous=!android; rec.interimResults=true; rec.maxAlternatives=1;
    let fin="";
    rec.onresult = e=>{
      let f="", interim="";
      for(let i=0;i<e.results.length;i++){ const r=e.results[i]; if(r.isFinal) f+=r[0].transcript.trim()+" "; else interim=r[0].transcript; }
      fin=f;
      const box=$("#"+tid); if(!box) return;
      const all=(acc+fin).replace(/\s+/g," ");
      if(tid==="answer" && /question suivante\s*$/i.test(all.trim())){ box.value=all.trim().replace(/[,.]?\s*question suivante\s*$/i,"").trim(); put(box.value); stopRec(); nextQ(true); return; }
      box.value = all+interim; put(box.value);
      if(tid==="answer"){ const pv=$("#preview"); if(pv) pv.innerHTML=previewHTML(curRep()); }
    };

function classerLocal(txt){
  const out={}; let cur=null;
  for(const st of decouperTexte(txt)){
    const n=" "+norm(st.action)+" "; const sc={};
    for(const q of ALLQ){ sc[q.id]=(KW[q.id]||[]).reduce((s,k)=>s+(n.includes(k)?1:0),0); }
    const best=Object.keys(sc).sort((x,y)=>sc[y]-sc[x])[0];
    if(sc[best]>0 && (!cur || sc[best]>sc[cur])) cur=best;
    const qid=cur||"a3";
    (out[qid]=out[qid]||[]).push(st);
    if(st.niveau==="absolu" && qid!=="a1") (out.a1=out.a1||[]).push({...st, id:uid()});
  }
  return out;
}

const ASR = { pipe:null, model:null,
  async load(model, onProg){
    if (this.pipe && this.model===model) return this.pipe;
    const T = await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.6/dist/transformers.min.js");
    T.env.allowLocalModels=false; T.env.useBrowserCache = (typeof caches!=="undefined");
    this.pipe = await T.pipeline("automatic-speech-recognition", model, {progress_callback:onProg});
    this.model=model; return this.pipe;
  }
};

function setAudioMsg(m){ if(S.imp.audio) S.imp.audio.msg=m; const el=$("#audiomsg"); if(el) el.textContent=m; }
async function decodeAudio(file){
  const buf=await file.arrayBuffer(); const AC=window.AudioContext||window.webkitAudioContext;
  const ctx=new AC({sampleRate:16000});
  try{ const ab=await ctx.decodeAudioData(buf); let d=ab.getChannelData(0);
    if(ab.numberOfChannels>1){ const r=ab.getChannelData(1), m=new Float32Array(d.length); for(let i=0;i<d.length;i++) m[i]=(d[i]+r[i])/2; d=m; }
    return {data:d, duration:ab.duration}; }
  finally{ try{ ctx.close(); }catch(e){} }
}
async function transcribeAudio(file){
  if(inClaude()){ toast("Ici, utilisez la transcription de WhatsApp ou la version HTML/APK."); return; }
  stopRec(); TTS.stop();
  S.imp.audio={busy:true, msg:"Lecture du fichier audio…"}; render();
  try{
    let dec; try{ dec=await decodeAudio(file); }catch(e){ throw new Error("ce format audio n'est pas lisible sur ce téléphone"); }
    const model = S.imp.precis ? "Xenova/whisper-small" : "Xenova/whisper-base";
    const files={};
    setAudioMsg("Préparation du module de reconnaissance…");
    let pipe;
    try{ pipe=await ASR.load(model, p=>{ if(p && p.status==="progress" && p.file){ files[p.file]=[p.loaded||0, p.total||0]; let l=0,t=0; for(const [a,b] of Object.values(files)){ l+=a; t+=b; } setAudioMsg(`Téléchargement du module : ${t?Math.round(l/t*100):0} % (une seule fois)`); } }); }
    catch(e){ throw new Error("le module de reconnaissance n'a pas pu se télécharger (vérifiez Internet)"); }
    setAudioMsg(`Transcription de ${Math.max(1,Math.round(dec.duration))} s d'audio en cours… (environ ${Math.max(1,Math.round(dec.duration/ (S.imp.precis?15:40)))} min)`);
    const out = await pipe(dec.data, {language:"french", task:"transcribe", chunk_length_s:30, stride_length_s:5});
    const txt = (Array.isArray(out)?out.map(o=>o.text).join(" "):(out&&out.text)||"").replace(/\s+/g," ").trim();
    if(!txt) throw new Error("aucune parole reconnue dans ce fichier");
    S.imp.texte=(S.imp.texte?S.imp.texte.trim()+"\n":"")+txt; S.imp.audio=null; render();
    toast("Message vocal transcrit. Relisez le texte, puis touchez « Découper en rubriques ».", 6000);
  }catch(e){ S.imp.audio=null; render(); toast("Transcription impossible : "+((e&&e.message)||e)+".", 7000); }
}

async function photoWithBox(e){
  const u=await Store.photoURL(e.photo); if(!u) return null;
  const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=u; });

  const c=document.createElement("canvas"); c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k);
  const g=c.getContext("2d"); g.drawImage(img,0,0,c.width,c.height);

/* ---------- Découpage d'un texte libre ou dicté (sans Claude) ---------- */
const VERBES_IRR = {
  "allez":"aller","vas":"aller","va":"aller","vais":"aller","rendez-vous":"aller","rends-toi":"aller",
  "mettez":"mettre","mets":"mettre","met":"mettre","attendez":"attendre","attends":"attendre","attend":"attendre",
  "choisissez":"choisir","choisis":"choisir","choisit":"choisir","remplissez":"remplir","remplis":"remplir","remplit":"remplir",
  "saisissez":"saisir","saisis":"saisir","saisit":"saisir","ouvrez":"ouvrir","ouvres":"ouvrir","ouvre":"ouvrir",
  "éteignez":"éteindre","éteins":"éteindre","éteint":"éteindre","lisez":"lire","lis":"lire","lit":"lire",
  "faites":"faire","fais":"faire","fait":"faire","prenez":"prendre","prends":"prendre","prend":"prendre",
  "sortez":"sortir","sors":"sortir","sort":"sortir","mettre":"mettre","remettez":"remettre","remets":"remettre",
  "attendre":"attendre","vérifies":"vérifier","retournez":"retourner","reviens":"revenir","revenez":"revenir","revient":"revenir",
  "maintenez":"maintenir","maintiens":"maintenir","tenez":"tenir","tiens":"tenir","introduisez":"introduire","introduis":"introduire",
  "relisez":"relire","relis":"relire","appuies":"appuyer","appuie":"appuyer","appuyez":"appuyer"
};
const VERBES_ER = ["cliquer","appuyer","aller","sélectionner","vérifier","placer","scanner","lancer","retirer","fermer","entrer","valider","confirmer","allumer","quitter","charger","retourner","passer","enregistrer","verser","mélanger","diluer","régler","insérer","nettoyer","toucher","démarrer","arrêter","contrôler","noter","imprimer","changer","remplacer","déposer","poser","jeter","vider","rincer","essuyer","activer","désactiver","initialiser","calibrer","programmer","demander","rechercher","chercher","cocher","décocher","taper","ajouter","supprimer","copier","coller","positionner","identifier","étiqueter","agiter","centrifuger","décongeler","homogénéiser","pipeter","reconstituer","patienter","observer","regarder","surveiller","utiliser","accéder","afficher","glisser","tourner","pousser","tirer","refermer","rouvrir","exécuter","relancer","mesurer","comparer","consulter","transférer","décharger","recharger","brancher","débrancher","laver","sécher","stocker","conserver","éliminer","porter","appeler","prévenir","signaler","remplacer","mettre","attendre","choisir","remplir","saisir","ouvrir","éteindre","lire","faire","prendre","sortir"];
const VSET = new Set(VERBES_ER);
function versInfinitif(w){
  const m = w.toLowerCase();
  if (VERBES_IRR[m]) return VERBES_IRR[m];
  if (VSET.has(m)) return m;
  for (const suf of ["ez","es","e"]) if (m.endsWith(suf)){ const inf=m.slice(0,-suf.length)+"er"; if (VSET.has(inf)) return inf; }
  if (m.endsWith("ons")){ const inf=m.slice(0,-3)+"er"; if (VSET.has(inf)) return inf; }
  return null;
}
const CONNECTEURS = String.raw`(?:et\s+)?(?:ensuite|puis|après\s+(?:ça|cela|ceci)|après|alors|maintenant|enfin|d'abord|tout d'abord|premièrement|deuxièmement|troisièmement|une\s+fois\s+(?:que|terminé|fini|cela fait|c'est fait)|à\s+la\s+fin|dès\s+que|étape\s+suivante|et\s+là)`;
const SUJETS = String.raw`(?:et\s+)?(?:tu|vous|on|il\s+faut|il\s+faudra|il\s+faut\s+bien|nous)`;
function premierVerbe(cl){
  /* retourne [infinitif, reste] si la proposition commence par un verbe d'action */
  let s = cl.replace(/^(?:et|alors|donc|bon|bien|ensuite|puis|après|maintenant|enfin)\s+/i,"");
  s = s.replace(/^(?:tu|vous|on|nous|il\s+faut(?:\s+bien)?|il\s+faudra|faut)\s+/i,"");
  s = s.replace(/^(?:vas|allez|va)\s+(?=\S+er\b|\S+ir\b|\S+re\b)/i,"");         /* « tu vas cliquer » → « cliquer » */
  s = s.replace(/^(?:dois|devez|doit|devrez)\s+/i,"");
  const m = s.match(/^([a-zàâçéèêëîïôûùüÿœ'-]+)\b(.*)$/i);
  if (!m) return null;
  const inf = versInfinitif(m[1]);
  return inf ? [inf, m[2].trim()] : null;
}
const STOP_BOUTON = /\s+(?:et|puis|pour|ensuite|jusqu|avec|afin|qui|quand|lorsque|si|en\s+bas|en\s+haut|à\s+gauche|à\s+droite|de\s+l'écran|sur\s+l'écran|après|alors|par)\b.*$/i;
function boutonParle(inf, reste){
  let m;
  if (/^(cliquer|appuyer|toucher)$/.test(inf) && (m=reste.match(/^sur\s+(?:le\s+|la\s+|l'|les\s+)?(?:bouton\s+|menu\s+|onglet\s+|icône\s+)?(.+)$/i))) return m[1];
  if (/^(aller|accéder|retourner|revenir|passer)$/.test(inf) && (m=reste.match(/^(?:dans|sur|à|au)\s+(?:le\s+|la\s+|l'|les\s+)?(?:menu\s+|onglet\s+|écran\s+|section\s+|rubrique\s+|page\s+)?(.+)$/i))) return m[1];
  if (/^(sélectionner|choisir|ouvrir|lancer|activer|cocher|valider)$/.test(inf) && (m=reste.match(/^(?:le\s+|la\s+|l'|les\s+)?(?:menu|onglet|bouton|écran|option|section)\s+(.+)$/i))) return m[1];
  if (/^(sélectionner|cocher)$/.test(inf)) return reste.replace(/^(?:le\s+|la\s+|l'|les\s+)/i,"");
  return "";
}
function nettoyerBouton(b){
  b = String(b||"").replace(/[«»"“”]/g,"").replace(STOP_BOUTON,"").replace(/[.,;:!?]+$/,"").trim();
  if (!b || b.split(/\s+/).length>6) return "";
  return cap(b);
}
function decouperLocal(t){
  let txt = String(t||"")
    .replace(/\s*(?:point\s+)?à\s+la\s+ligne\s*/gi, ". ")
    .replace(/\s+virgule\b/gi, ",")
    .replace(/\s+/g," ").trim();
  /* découpe : ponctuation forte, connecteurs, « tu / vous / on / il faut » + verbe, « attention » */
  const parts = txt.split(new RegExp(String.raw`\s*(?:[.;!?]+\s+|[.;!?]+$|,?\s+(?=${CONNECTEURS}\b)|,?\s+(?=${SUJETS}\s)|,?\s+(?=attention\b)|,?\s+(?=(?:ne\s+(?:jamais|surtout\s+pas|pas)|il\s+ne\s+faut)\b))`, "i"))
    .map(s=>s&&s.trim()).filter(s=>s && s.length>1);
  const out=[]; let alerteSuivante=false;
  for (let p of parts){
    p = p.replace(new RegExp(String.raw`^${CONNECTEURS}\s*,?\s*`,"i"),"").replace(/^[-•\d.)\s]+/,"").replace(/\s*[,.;]$/,"").trim();
    if (!p || /^(?:et|alors|donc|bon|ensuite|puis|il\s+faut|il\s+faudra|faut|tu|vous|on|nous)$/i.test(p)) continue;
    if (/^(?:attention|important|remarque|note|vérification)$/i.test(p)){ alerteSuivante=true; continue; }
    if (alerteSuivante && out.length){
      alerteSuivante=false; const prev=out[out.length-1];
      const msg=cap(p.replace(/^(?:et\s+)?(?:il\s+faut(?:\s+bien)?|tu\s+dois|vous\s+devez|on\s+doit|faut)\s+/i,""));
      prev.alerte=(prev.alerte?prev.alerte+" ":"")+msg+(/[.!?]$/.test(msg)?"":".");
      if (prev.niveau!=="absolu") prev.niveau=/\b(jamais|interdit)\b/i.test(msg)?"absolu":"attention";
      continue;
    }
    alerteSuivante=false;
    const al = p.match(/^(?:attention|important|remarque|note|vérification)\s*[:,]?\s*(.+)$/i);
    const interdit = /^(?:il\s+ne\s+faut|ne\s+(?:jamais|surtout\s+pas|pas))\b/i.test(p);
    if ((al || interdit) && out.length){
      const prev=out[out.length-1]; const msg=cap((al?al[1]:p).replace(/^il\s+ne\s+faut\s+(jamais|pas)\s+/i,"ne $1 ").replace(/^(?:il\s+)?faut\s+/i,""));
      prev.alerte=(prev.alerte?prev.alerte+" ":"")+msg+(/[.!?]$/.test(msg)?"":".");
      prev.niveau = (interdit || /\b(jamais|interdit)\b/i.test(msg)) ? "absolu" : (prev.niveau==="absolu"?"absolu":"attention");
      continue;
    }
    const v = premierVerbe(p);
    if (!v){
      if (!out.length && /^pour\b/i.test(p)) continue;              /* préambule « pour lancer la calibration… » */
      if (out.length && p.split(/\s+/).length<=14 && !/[A-ZÀ-Ý]{2}/.test(p.slice(0,3))){   /* précision sur l'étape précédente */
        const prev=out[out.length-1]; const msg=cap(p);
        prev.alerte=(prev.alerte?prev.alerte+" ":"")+msg+(/[.!?]$/.test(msg)?"":".");
        if (!prev.niveau && /\b(doit|faut|vérif|bien|obligatoire|impérati)/i.test(p)) prev.niveau="attention";
        continue;
      }
      const abs=/\b(jamais|interdit|surtout pas)\b/i.test(p);
      out.push({id:uid(), action:cap(p)+".", bouton:extraireBouton(p), alerte:"", niveau:abs?"absolu":"", photo:"", box:null});
      continue;
    }
    const [inf, reste] = v;
    let b = nettoyerBouton(boutonParle(inf, reste));
    let restePropre = reste;
    if (b){ const low=b.toLowerCase(); const i=restePropre.toLowerCase().indexOf(low); if(i>=0) restePropre=restePropre.slice(0,i)+b+restePropre.slice(i+b.length); }
    const action = cap(inf)+(restePropre?" "+restePropre:"")+".";
    if (!b) b = extraireBouton(restePropre);
    const abs=/\b(jamais|interdit|surtout pas)\b/i.test(p);
    out.push({id:uid(), action, bouton:b, alerte:"", niveau:abs?"absolu":"", photo:"", box:null});
  }
  return out;
}

  else e.photo=P.ref;
  e.box = e.photo ? P.box : null;
  P.blob=null; await saveDraft(false).catch(()=>{}); $("#sheet").hidden=true; document.body.style.overflow=""; P.i=null; render();
}

function leaveSaisir(){ return (S.view==="auto" && S.tab==="saisir" && S.draft) ? saveDraft(false).catch(()=>{}) : Promise.resolve(); }
/* ---------- Détection automatique des étapes dans un texte saisi ---------- */
const lowerFirst = s => s && !/^[A-ZÀ-Ý]{2}/.test(s) ? s.charAt(0).toLowerCase()+s.slice(1) : s;
function decouperTexte(t){
  const lines = String(t||"").split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const marker = l => /^(\d{1,2}[.)]?|étape\s*\d+\s*[:.)\-–]?|[•\-*–])$/i.test(l);
  const inlineNum = l => /^(?:\d{1,2}|étape\s*\d+)\s*[:.)\-–]\s+\S/i.test(l);
  const bullet = l => /^[•\-*–]\s+\S/.test(l);
  if (!(lines.length>1 && lines.some(l=>marker(l)||inlineNum(l)||bullet(l)))) return decouperLocal(t);
  const blocks=[]; let b=null; let bulletNext=false;
  const nb=()=>{ b={titre:"", items:[]}; blocks.push(b); };
  for (const l of lines){
    let txt=l, isBullet=false, m;
    if (/^\d{1,2}[.)]?$/.test(l)){ nb(); bulletNext=false; continue; }
    if (/^étape\s*\d+\s*[:.)\-–]?$/i.test(l)){ if(!b || b.items.length) nb(); bulletNext=false; continue; }
    if (/^[•\-*–]$/.test(l)){ bulletNext=true; continue; }
    if ((m=l.match(/^(?:étape\s*\d+|\d{1,2})\s*[:.)\-–]\s*(.+)$/i))){ nb(); txt=m[1]; }
    else if (bullet(l)){ txt=l.replace(/^[•\-*–]\s+/,""); isBullet=true; }
    if (bulletNext){ isBullet=true; bulletNext=false; }
    if (!b) nb();
    if (!b.titre && !b.items.length && !isBullet && txt.length<70 && !/[.!?;]$/.test(txt)){ b.titre=txt; continue; }
    b.items.push(txt);
  }
  const out=[];
  for (const k of blocks){
    if (!k.titre && !k.items.length) continue;
    const instr=[], alerts=[]; let niv="";
    for (const it of k.items){
      const a = it.match(/^(vérification|vérifier|attention|important|remarque|note|nb)\s*:\s*(.+)$/i);
      if (a){ alerts.push(cap(a[2].trim())); if(!/^(remarque|note|nb)$/i.test(a[1])) niv="attention"; }
      else instr.push(it);
    }
    let action = instr.join(" ").trim();
    if (k.titre) action = action ? `${k.titre.replace(/[.:]$/,"")} : ${lowerFirst(action)}` : k.titre;
    if (!action && alerts.length) action = alerts.shift();
    if (!/[.!?]$/.test(action)) action += ".";
    if (/\b(jamais|interdit)\b/.test(norm(action+" "+alerts.join(" ")))) niv="absolu";
    out.push({id:uid(), action:cap(action), bouton:extraireBouton(instr.join(" ")||action), alerte:alerts.join(" "), niveau:niv, photo:"", box:null});
  }
  return out.length ? out : decouperLocal(t);
}
/* Étapes à afficher : celles enregistrées, sinon celles détectées dans le texte */
const _stepCache = new Map();
function stepsOf(rep){
  if (!rep) return [];
  const et=(rep.etapes||[]).filter(e=>e.action);
  if (et.length) return et;
  const t=(rep.texte||"").trim(); if(!t) return [];
  if (!_stepCache.has(t)) _stepCache.set(t, decouperTexte(t));
  return _stepCache.get(t);
}
/* Faut-il (re)découper cette réponse à l'enregistrement ? */
function needsSplit(rep){
  if (!rep || rep.na || !(rep.texte||"").trim()) return false;
  const et=(rep.etapes||[]).filter(e=>e.action);
  if (!et.length) return true;
  const base = rep.splitFrom!==undefined ? rep.splitFrom : et.map(e=>e.action).join(" ");
  return norm(base).replace(/\s+/g," ").trim() !== norm(rep.texte).replace(/\s+/g," ").trim();
}
async function autoSplit(rep, q, nom){
  const anciennes=rep.etapes||[];
  const garder = list => list.map(e=>{ const o=anciennes.find(x=>x.photo && x.bouton && norm(x.bouton)===norm(e.bouton)); return o?{...e, photo:o.photo, box:o.box}:e; });
  let et=null;
  if (Store.sample){
    try{
      const r = await Store.sample.json(promptEtapes(nom, q.t, rep.texte), {modelTier:"quick"});
      et=(r&&Array.isArray(r.etapes)?r.etapes:[]).filter(e=>e&&e.action).map(e=>({id:uid(), action:String(e.action), bouton:String(e.bouton||""), alerte:String(e.alerte||""), niveau:["absolu","attention"].includes(e.niveau)?e.niveau:"", photo:"", box:null}));
      if(!et.length) et=null;
    }catch(e){ et=null; }
  }
  if (!et) et=decouperTexte(rep.texte);
  rep.etapes=garder(et); rep.splitFrom=rep.texte;
  return rep.etapes.length;
}
function promptEtapes(nom, question, txt){
  return `Tu aides un technicien de laboratoire à rédiger la procédure de l'automate « ${nom} ». Question de la procédure : « ${question} ». Texte saisi ou dicté par le technicien (il peut être copié d'un document, avec des numéros, des titres, des puces, ou contenir des erreurs de dictée et les mots « étape suivante ») : « ${txt} ». Découpe ce texte en étapes, dans l'ordre, sans rien inventer ni ajouter. Une étape = une action concrète, verbe à l'infinitif ; si le texte donne un titre d'étape, commence l'action par ce titre suivi de « : ». Corrige seulement les fautes évidentes. Pour chaque étape : "bouton" = libellé exact du bouton, menu, onglet ou élément cité (chaîne vide si aucun) ; "alerte" = la vérification ou mise en garde associée à cette étape (chaîne vide sinon) ; "niveau" = "absolu" pour une interdiction stricte, "attention" pour une vérification ou une précaution, "" sinon. Réponds uniquement en JSON : {"etapes":[{"action":"","bouton":"","alerte":"","niveau":""}]}`;
}
function previewHTML(rep){
  if (!rep || rep.na || !(rep.texte||"").trim() || !needsSplit(rep)) return "";
  const et=decouperTexte(rep.texte);
  if (!et.length) return "";
  return `<div class="preview"><div class="row" style="justify-content:space-between"><span class="eyebrow">Aperçu : ${et.length} étape${et.length>1?"s":""} détectée${et.length>1?"s":""}</span><span class="hint">${Store.sample?"Claude affinera à l'enregistrement":"Appliqué à l'enregistrement"}</span></div>
    <ol class="steps">${et.map(e=>`<li class="step"><div class="step-body"><div>${fmtAction(e.action)}${e.bouton?` <span class="kbd">${esc(e.bouton)}</span>`:""}</div>${alertHTML(e)}</div></li>`).join("")}</ol></div>`;
}
/* Titre d'étape (avant « : ») en gras, comme dans les procédures existantes */
function fmtAction(a, ts){
  const m=String(a).match(/^([^:]{3,60}?)\s:\s(.+)$/s);
  return m ? `<strong>${hi(m[1],ts)}</strong> : ${hi(m[2],ts)}` : hi(a,ts);
}

/* ---------- Événements ---------- */
document.addEventListener("click", async ev=>{
  const t=ev.target.closest("[data-act]"); if(!t) return;
  const act=t.dataset.act; const a=current();
  switch(act){
    case "new": go("new",{importAfter:false}); break;
    case "create": createAuto(); break;
    case "goq": { stopRec(); await saveDraft(false).catch(()=>{}); S.qi=+t.dataset.i; S.qsearch=""; render(); window.scrollTo(0,0); break; }
    case "save-fiche": saveFiche(); break;
    case "new-import": go("new",{importAfter:true}); break;
    case "go-import": stopRec(); await leaveSaisir(); S.imp={texte:"", result:null, busy:false}; go("import"); break;
    case "imp-back": stopRec(); go("auto",{tab:"lire", draft:null}); break;
    case "mic-imp": startRec("imptext"); break;
    case "imp-run": runImport(); break;
    case "imp-edit": S.imp.result=null; render(); break;
    case "imp-save": saveImport(); break;
    case "voice-search": voiceSearch(t.dataset.target); break;
    case "clear-search": S.search=""; render(); break;
    case "open-search": go("auto",{autoId:t.dataset.id, tab:"lire", draft:null, search:S.searchAll}); break;
    case "listen-found": { const ts=terms(S.search); const ids=ALLQ.filter(q=>hasContent(a,q.id)&&matchQ(a,q,ts)).map(q=>q.id); TTS.start(itemsFor(a,null,ids), "Recherche « "+S.search+" »"); break; }
    case "set-na": { const x=prepare(clone(a)); x.reponses[t.dataset.q]={texte:"", etapes:[], na:true}; try{ await Store.save(x); render(); toast("Question marquée sans objet."); }catch(e){ toast("Enregistrement impossible."); } break; }
    case "word-all": exportWord(a, null, t); break;
    case "word-rub": exportWord(a, t.dataset.rub, t); break;
    case "home": TTS.stop(); await leaveSaisir(); go("list",{autoId:null, draft:null, confirmDel:false}); break;
    case "open": go("auto",{autoId:t.dataset.id, tab:"lire", draft:null, qi:0, confirmDel:false, search:""}); break;
    case "listen-all": { ev.stopPropagation(); const x=Store.get(t.dataset.id); if(x){ if(S.view==="list") go("auto",{autoId:x.id, tab:"lire", draft:null}); TTS.start(itemsFor(x), x.nom); } break; }
    case "listen-rub": { const r=RUBRIQUES.find(r=>r.id===t.dataset.rub); TTS.start(itemsFor(a,[r.id]), r.titre); break; }
    case "jump": document.getElementById("rub-"+t.dataset.rub)?.scrollIntoView({block:"start"}); break;
    case "tab": if(S.tab==="saisir" && t.dataset.tab!=="saisir"){ stopRec(); await leaveSaisir(); } S.tab=t.dataset.tab; S.confirmDel=false; if(S.tab!=="saisir") S.draft=null; render(); break;
    case "answer": S.tab="saisir"; S.draft=null; S.qi=ALLQ.findIndex(q=>q.id===t.dataset.q); render(); window.scrollTo(0,0); break;
    case "say-q": TTS.say(ALLQ[S.qi].t); break;
    case "mic": startRec(); break;
    case "split": stopRec(); splitSteps(t); break;
    case "add-step": curRep().etapes.push({id:uid(), action:"", bouton:"", alerte:"", niveau:"", photo:"", box:null}); render(); break;
    case "st-up": case "st-down": case "st-del": { const et=curRep().etapes, i=+t.dataset.i;
      if(act==="st-del") et.splice(i,1); else { const j=act==="st-up"?i-1:i+1; [et[i],et[j]]=[et[j],et[i]]; } render(); break; }
    case "photo": stopRec(); openPhoto(+t.dataset.i); break;
    case "prevq": stopRec(); saveDraft(false).then(()=>{ S.qi--; render(); window.scrollTo(0,0); }).catch(()=>{}); break;
    case "nextq": stopRec(); nextQ(); break;
    case "save": saveDraft(true).then(()=>render()).catch(()=>{}); break;
    case "copy": { const txt=procedureText(a); try{ await navigator.clipboard.writeText(txt); toast("Procédure copiée."); }catch(e){ toast("Copie refusée par l'appareil."); } break; }
    case "dl-txt": case "dl-json": { try{ const json=act==="dl-json"; await Store.downloads.save({filename:`${(a.nom||"automate").replace(/[^\wÀ-ÿ-]+/g,"_")}.${json?"json":"txt"}`, data: json?JSON.stringify(a,null,2):procedureText(a)}); }catch(e){ toast("Téléchargement annulé."); } break; }
    case "del": S.confirmDel=true; render(); break;
    case "del-no": S.confirmDel=false; render(); break;
    case "del-yes": try{ TTS.stop(); await Store.remove(a.id); go("list",{autoId:null, confirmDel:false}); toast("Automate supprimé."); }catch(e){ toast("Suppression impossible."); } break;
    case "p-toggle": TTS.toggle(); break;
    case "p-prev": TTS.move(-1); break;
    case "p-next": TTS.move(1); break;
    case "p-stop": TTS.stop(); break;
    case "p-rate": { const r=[0.8,1,1.2]; TTS.rate=r[(r.indexOf(TTS.rate)+1)%r.length]; drawPlayer(); if(TTS.playing) TTS.speak(); break; }
    case "sh-close": closeSheet(); break;
    case "sh-pick": $("#sh-file").click(); break;
    case "sh-clear": P.box=null; drawSheet(); break;
    case "sh-remove": if(P.blob&&P.url) URL.revokeObjectURL(P.url); P.blob=null; P.url=""; P.ref=""; P.box=null; drawSheet(); break;
    case "sh-detect": detectBox(); break;
    case "sh-done": finishPhoto(); break;
  }
});
document.addEventListener("keydown", ev=>{ if(ev.key==="Enter" && ev.target.matches("#newform input")){ ev.preventDefault(); createAuto(); return; } if(ev.key==="Enter" && ev.target.matches("#ficheform input")){ ev.preventDefault(); saveFiche(); return; } if((ev.key==="Enter"||ev.key===" ") && ev.target.matches('.card[data-act="open"]')){ ev.preventDefault(); ev.target.click(); } });
document.addEventListener("input", ev=>{
  const t=ev.target;
  if(t.id==="answer"){ setText(t.value); clearTimeout(window._pv); window._pv=setTimeout(()=>{ const pv=$("#preview"); if(pv) pv.innerHTML=previewHTML(curRep()); },500); return; }
  if(t.id==="sh-bouton"){ P.bouton=t.value; return; }
  if(t.id==="imptext"){ S.imp.texte=t.value; return; }
  if(t.id==="search"){ S.search=t.value; render(); return; }
  if(t.id==="searchall"){ S.searchAll=t.value; render(); return; }
  if(t.id==="qsearch"){ S.qsearch=t.value; const box=$("#qresults"); if(box&&S.draft) box.innerHTML=qResults(S.draft); return; }
  if(t.dataset.st!=null){ const r=curRep(); const e=r.etapes[+t.dataset.st]; if(e){ e[t.dataset.k]=t.value; r.splitFrom=r.texte; } }
});
document.addEventListener("change", async ev=>{
  const t=ev.target;
  if(t.id==="qpick"){ stopRec(); await saveDraft(false).catch(()=>{}); S.qi=+t.value; render(); return; }
  if(t.id==="na"){ curRep().na=t.checked; if(t.checked) stopRec(); render(); return; }
  if(t.id==="impaudio" && t.files && t.files[0]){ transcribeAudio(t.files[0]); return; }
  if(t.id==="impprecis"){ S.imp.precis=t.value==="1"; return; }
  if(t.id==="impfile" && t.files && t.files[0]){ try{ S.imp.texte=(S.imp.texte?S.imp.texte+"\n":"")+await t.files[0].text(); render(); }catch(e){ toast("Ce fichier ne peut pas être lu."); } return; }
  if(t.dataset.st!=null && t.dataset.k==="niveau"){ const e=curRep().etapes[+t.dataset.st]; if(e) e.niveau=t.value; }
  if(t.id==="sh-file" && t.files && t.files[0]){
    try{ const b=await compress(t.files[0]); if(P.blob&&P.url) URL.revokeObjectURL(P.url); P.blob=b; P.url=URL.createObjectURL(b); P.box=null; drawSheet(); }
    catch(e){ toast("Cette image ne peut pas être lue."); }
  }
});
function ficheValues(f){ const vals={}; f.querySelectorAll("[data-fiche]").forEach(i=>vals[i.dataset.fiche]=i.value.trim()); return vals; }
const withTimeout = (p, ms) => Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej({code:"timeout", message:"pas de réponse du serveur"}), ms))]);
function errMsg(e){ if(!e) return "erreur inconnue"; if(e.code==="invalid_argument") return "vous n'avez pas le droit de modifier cette page (demandez l'accès Contributeur)"; if(e.code==="quota_exceeded") return "espace de stockage plein"; if(e.code==="timeout"||e.code==="unavailable") return "connexion lente ou coupée, réessayez"; return e.message||e.code||String(e); }
let creating=false;
async function createAuto(){
  if(creating) return;
  const f=$("#newform"); if(!f) return;
  const vals=ficheValues(f);
  if(!vals.nom){ toast("Écrivez d'abord le nom de l'automate."); $("#f-nom")?.focus(); return; }
  const btn=$("#createbtn"); creating=true; if(btn){ btn.disabled=true; btn.textContent="Création…"; }
  try{
    const base=(norm(vals.nom).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"automate").slice(0,40);
    const id = Store.get(base) ? base+"-"+uid().slice(0,4) : base;
    const a={id, ...vals, reponses:{}};
    await withTimeout(Store.save(a), 12000);
    creating=false;
    if(S.importAfter){ S.imp={texte:"", result:null, busy:false}; go("import",{autoId:id, importAfter:false}); }
    else { go("auto",{autoId:id, tab:"saisir", draft:null, qi:0}); try{ TTS.say(ALLQ[0].t); }catch(e){} }
    toast(`« ${vals.nom} » créé.`);
  }catch(e){
    creating=false; if(btn){ btn.disabled=false; btn.textContent=S.importAfter?"Créer et importer la procédure":"Créer et répondre aux questions"; }
    toast("Création impossible : "+errMsg(e)+".", 6000);
  }
}
async function saveFiche(){
  const f=$("#ficheform"); if(!f) return; const vals=ficheValues(f);
  if(!vals.nom){ toast("Le nom de l'automate est obligatoire."); return; }
  try{ await withTimeout(Store.save({...clone(current()), ...vals}), 12000); toast("Fiche enregistrée."); render(); }catch(e){ toast("Enregistrement impossible : "+errMsg(e)+".", 6000); }
}
document.addEventListener("submit", ev=>{ ev.preventDefault(); if(ev.target.id==="newform") createAuto(); else if(ev.target.id==="ficheform") saveFiche(); });
window.addEventListener("beforeunload", ()=>{ try{ speechSynthesis.cancel(); }catch(e){} });

TTS.init();
Store.init().catch(()=>{ Store.loaded=true; render(); toast("Les données n'ont pas pu être chargées."); });
